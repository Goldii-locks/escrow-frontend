upstream backend {
    server backend:3001;
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80 default_server;
    server_name milestonepay.app www.milestonepay.app;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name milestonepay.app www.milestonepay.app;

    ssl_certificate     /etc/letsencrypt/live/milestonepay.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/milestonepay.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 2m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      application/wasm text/xml application/xml image/svg+xml;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /health {
        access_log off;
        proxy_pass http://backend/health;
        proxy_set_header Host $host;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;

        # NO trailing slash on proxy_pass. The Express app does
        # app.use("/api", ...), so it expects to receive the /api prefix.
        # A trailing slash here would strip it and 404 every route.
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffering on;
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Static export emits flat files: /create.html, /dashboard.html, /admin.html.
    # This is NOT an SPA — do not fall back everything to index.html, or a
    # typo'd URL silently renders the home page instead of a 404.
    #
    # The $uri.html arm is what actually resolves page requests. The export
    # ALSO emits a directory per route (out/dashboard/, out/admin/, ...), but
    # those hold only RSC payloads for client-side navigation
    # (__next.*.txt) — there is no index.html inside them. A request for
    # /dashboard therefore skips $uri (nginx does not match a directory
    # given without a trailing slash) and resolves via $uri.html ->
    # dashboard.html. The $uri/index.html arm never fires for exported
    # routes; it is kept only as a harmless guard in case a future config
    # sets trailingSlash: true, which would emit dashboard/index.html instead.
    # The .txt payloads match $uri directly, since they are real files.
    #
    # The fallback is =404, NOT /404.html. Naming a file as the last
    # try_files argument makes nginx serve that file with status 200 — so
    # /nonsense would return "200 OK" carrying the not-found page, which is
    # wrong for crawlers and makes smoke tests pass on broken URLs.
    # =404 raises a real 404, and `error_page 404 /404.html` below renders
    # the exported page with the status intact. Verified: /nonsense -> 404.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    error_page 404 /404.html;

    location ~ /\.(?!well-known) {
        deny all;
    }
}
