name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit runtime dependencies
        # High/critical advisories fail the build unless allowlisted with a
        # reason in .audit-allowlist.json.
        run: node scripts/audit-gate.mjs

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Type check
        run: npx tsc --noEmit

      - name: Test with coverage
        run: npm run test:coverage

      - name: Publish coverage summary
        if: ${{ !cancelled() }}
        run: node scripts/coverage-summary.mjs

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

      - name: Build
        run: npm run build

      - name: Bundle size budget
        run: node scripts/bundle-size.mjs

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke test static export
        timeout-minutes: 3
        run: npm run test:e2e
