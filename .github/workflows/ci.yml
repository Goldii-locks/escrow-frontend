name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit runtime dependencies
        # High/critical advisories fail the build unless allowlisted with a
        # reason in .audit-allowlist.json.
        run: node scripts/audit-gate.mjs

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Type check
        run: npx tsc --noEmit

      - name: Test with coverage
        run: npm run test:coverage

      - name: Publish coverage summary
        if: ${{ !cancelled() }}
        run: node scripts/coverage-summary.mjs

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

      - name: Build
        run: npm run build

      - name: Bundle size budget
        run: node scripts/bundle-size.mjs

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke test static export
        timeout-minutes: 3
        run: npm run test:e2e

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Install Lighthouse CI
        run: npm install --no-save @lhci/cli

      - name: Install Chrome
        run: npx playwright install --with-deps chromium

      - name: Write Lighthouse CI config
        run: |
          cat > lighthouserc.json <<'EOF'
          {
            "ci": {
              "collect": {
                "url": [
                  "http://localhost:3000/",
                  "http://localhost:3000/dashboard",
                  "http://localhost:3000/create"
                ],
                "startServerCommand": "bash e2e/serve.sh",
                "startServerReadyPattern": "Serving|Listening|localhost:3000",
                "startServerReadyTimeout": 30000,
                "numberOfRuns": 1,
                "settings": {
                  "chromeFlags": "--no-sandbox --headless=new",
                  "preset": "desktop"
                }
              },
              "assert": {
                "assertions": {
                  "categories:performance": ["warn", { "minScore": 0.8 }],
                  "categories:accessibility": ["warn", { "minScore": 0.95 }],
                  "categories:seo": ["warn", { "minScore": 0.9 }]
                }
              },
              "upload": {
                "target": "filesystem",
                "outputDir": ".lighthouseci"
              }
            }
          }
          EOF

      - name: Run Lighthouse CI
        run: npx lhci autorun

      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: .lighthouseci/
          if-no-files-found: ignore