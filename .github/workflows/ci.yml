name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit runtime dependencies
        # High/critical advisories fail the build unless allowlisted with a
        # reason in .audit-allowlist.json.
        run: node scripts/audit-gate.mjs

      - name: Check (format, lint, types, tests)
        # Mirrors the local `npm run check` script so local and CI cannot drift.
        run: npm run check

      - name: Publish coverage summary
        if: ${{ !cancelled() }}
        run: node scripts/coverage-summary.mjs

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

      - name: Build
        # Mirrors the build step of the local `npm run check:full` script.
        run: npm run build

      - name: Bundle size budget
        # Mirrors the bundle budget step of the local `npm run check:full` script.
        run: node scripts/bundle-size.mjs

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke test static export
        timeout-minutes: 3
        run: npm run test:e2e