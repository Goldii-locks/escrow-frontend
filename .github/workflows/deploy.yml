# escrow-frontend/.github/workflows/deploy.yml
#
# Differs from the backend workflow because NEXT_PUBLIC_* values must be
# passed as build args — they're inlined into the bundle, so the image is
# environment-specific and a contract change requires a rebuild.
#
# Triggered only after the CI workflow completes successfully on main, so a
# failing test or build never ships to production.

name: Deploy frontend to AWS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      contract_id:
        description: "Override NEXT_PUBLIC_CONTRACT_ID (leave blank to use the repo variable)"
        required: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: af-south-1
  SERVICE: frontend
  ECR_REPOSITORY: escrow-frontend

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # For workflow_run triggers, deploy only a successful CI run for a push to
    # main in this repository. `branches: [main]` alone also matches a pull
    # request from a fork whose branch is named main, which must never deploy.
    # workflow_dispatch bypasses this gate (manual redeploy).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Pin to the exact commit that CI passed, not whatever HEAD is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: meta
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "tag=${DEPLOY_SHA::12}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Resolve contract ID
        id: contract
        # Inputs go through env, not ${{ }} in the script, so a crafted
        # contract_id cannot inject shell.
        env:
          INPUT_CID: ${{ inputs.contract_id }}
          VAR_CID: ${{ vars.CONTRACT_ID }}
        run: |
          CID="$INPUT_CID"
          [ -n "$CID" ] || CID="$VAR_CID"
          [ -n "$CID" ] || { echo "::error::no CONTRACT_ID — set the repo variable"; exit 1; }
          echo "id=${CID}" >> "$GITHUB_OUTPUT"

      - name: Validate contract ID format
        env:
          CID: ${{ steps.contract.outputs.id }}
        run: |
          # Stellar contract addresses start with C followed by 55 base-32 chars (A-Z2-7)
          if ! echo "$CID" | grep -qE '^C[A-Z2-7]{55}$'; then
            echo "::error::Invalid contract ID '${CID}'. Expected a Stellar contract address matching ^C[A-Z2-7]{55}$ (56 characters, starts with C, base-32 alphabet)."
            exit 1
          fi
          echo "Contract ID format is valid: ${CID}"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=${{ vars.PUBLIC_ORIGIN }}
            NEXT_PUBLIC_CONTRACT_ID=${{ steps.contract.outputs.id }}
            NEXT_PUBLIC_SOROBAN_RPC_URL=${{ vars.SOROBAN_RPC_URL }}
            NEXT_PUBLIC_SOROBAN_NETWORK_PASSPHRASE=${{ vars.SOROBAN_NETWORK_PASSPHRASE }}
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Record deploy
        run: |
          echo "Deploying image ${{ needs.build.outputs.image_tag }} at commit ${{ github.event.workflow_run.head_sha || github.sha }}"
          {
            echo "### Production deploy"
            echo "- Image tag: ${{ needs.build.outputs.image_tag }}"
            echo "- Commit: ${{ github.event.workflow_run.head_sha || github.sha }}"
            echo "- Record in CHANGELOG.md under a dated heading, using PR titles labelled user-facing."
          } >> "$GITHUB_STEP_SUMMARY"

      - id: send
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Role,Values=escrow-prod" \
            --comment "deploy frontend ${{ needs.build.outputs.image_tag }}" \
            --parameters "commands=[\"/opt/escrow/deploy.sh frontend ${{ needs.build.outputs.image_tag }}\"]" \
            --query 'Command.CommandId' --output text)
          echo "command_id=${CMD_ID}" >> "$GITHUB_OUTPUT"

      - name: Wait and print instance output
        run: |
          set -euo pipefail
          CMD_ID="${{ steps.send.outputs.command_id }}"
          STATUS=Pending
          for i in $(seq 1 60); do
            STATUS=$(aws ssm list-command-invocations --command-id "$CMD_ID" \
              --query 'CommandInvocations[0].Status' --output text)
            echo "attempt ${i}: ${STATUS}"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
              *) sleep 5 ;;
            esac
          done
          aws ssm list-command-invocations --command-id "$CMD_ID" --details \
            --query 'CommandInvocations[0].CommandPlugins[0].Output' --output text
          [ "$STATUS" = "Success" ] || exit 1

      - name: Smoke test
        run: |
          set -euo pipefail
          BASE="${{ vars.PUBLIC_ORIGIN }}"
          curl -fsS --max-time 10 "${BASE}/healthz"
          # Deep link must return the exported .html, not a 404 and not index.
          curl -fsS --max-time 10 -o /dev/null -w '%{http_code}\n' "${BASE}/dashboard"
          curl -fsS --max-time 15 "${BASE}/health" \
            || echo "::warning::backend /health unreachable — expected while the soroban-sdk migration is outstanding"
