# Fallback CSP connect-src origins (#811).
#
# The production image regenerates this file at container start from
# NEXT_PUBLIC_SOROBAN_RPC_URL / NEXT_PUBLIC_HORIZON_URL /
# NEXT_PUBLIC_EXPLORER_URL using the template in nginx/templates and
# scripts/nginx-entrypoint.sh. This committed copy keeps bare nginx runs (for
# example the e2e smoke server) valid and documents the testnet defaults.
set $csp_connect_origins "'self' https://soroban-testnet.stellar.org https://horizon-testnet.stellar.org https://stellar.expert wss://relay.walletconnect.com https://verify.walletconnect.com https://lobstr.co https://albedo.link";
