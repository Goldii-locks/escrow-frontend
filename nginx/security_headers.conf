# Shared security headers (#810).
#
# nginx only inherits server-level `add_header` directives into a location that
# declares no `add_header` of its own. Three locations do declare one
# (@ratelimited, /_next/static/, ~* \.html$), which previously dropped every
# security header there — including "/" because `index index.html` internally
# redirects into the .html location.
#
# Include this snippet in EVERY location (not just those with their own header)
# so the policy is identical on every response. `$csp_script_hashes` is provided
# by /etc/nginx/csp-hashes.conf (generated at build time) and
# `$csp_connect_origins` by /etc/nginx/csp-origins.conf (templated at
# container start, #811).
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' $csp_script_hashes; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src $csp_connect_origins; frame-src 'self'; report-uri /api/csp-report" always;
